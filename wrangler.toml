name = "patter-voice-agent"
main = "src/worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Define the container image and instance hardware
[[containers]]
class_name = "PatterInferenceContainer"
image = "./Dockerfile"
instance_type = "standard-4"  # 4 vCPU, 12 GiB RAM, 20 GB disk
max_instances = 10

# Bind the container as a Durable Object
[[durable_objects.bindings]]
name = "INFERENCE_CONTAINER"
class_name = "PatterInferenceContainer"

# Run the migration for SQLite-backed Durable Object namespace
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PatterInferenceContainer"]

[vars]
MAX_CONTAINER_CALL_SLOTS = "4"
CAPACITY_HTTP_PORT = "8080"
PATTER_R2_BUCKET = "patter-models"
PATTER_R2_ENDPOINT = "https://27e89563673d4bcd83625e2e12948bd4.r2.cloudflarestorage.com"
